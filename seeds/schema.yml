version: 2

# Seeds use 'cortex' as default schema - generate_schema_name macro will override
# when target_dataset var is set to a client-specific value
seeds:
  - name: country_codes
    config:
      schema: cortex
    description: "Mapping of country names to ISO 3166-1 alpha-2 codes (lowercase). Used for normalizing Bing/Microsoft Ads country names."
    columns:
      - name: country_name
        description: "Full country name as returned by ad networks (e.g., 'United States')"
      - name: country_code
        description: "Lowercase ISO 3166-1 alpha-2 code (e.g., 'us')"

  - name: google_geo_targets
    config:
      schema: cortex
    description: "Mapping of Google Ads criterion IDs to ISO country codes. Required for Google geographic_view reports."
    columns:
      - name: criterion_id
        description: "Google Ads geo target criterion ID (e.g., 2840 for United States)"
      - name: country_code
        description: "Lowercase ISO 3166-1 alpha-2 code (e.g., 'us')"
      - name: country_name
        description: "Full country name for reference"

  - name: linkedin_geo_urn
    config:
      schema: cortex
    description: "Mapping of LinkedIn geo URNs to ISO country codes. LinkedIn API returns member_country as numeric URNs."
    columns:
      - name: geo_urn
        description: "LinkedIn geo URN identifier (numeric, e.g., 103644278 for United States)"
      - name: country_name
        description: "Full country name for reference"
      - name: country_code
        description: "Lowercase ISO 3166-1 alpha-2 code (e.g., 'us')"

  - name: allied_campaign_orders
    config:
      schema: allied_team
    description: "Campaign order data for Allied Team pacing calculations. Contains impressions ordered, budgets, and flight dates."
    columns:
      - name: platform_source
        description: "Source platform (Google YouTube, Magnite, Jamloop)"
      - name: media_channel
        description: "Media channel type"
      - name: plan_section
        description: "Targeting segment"
      - name: creative
        description: "Creative name"
      - name: impressions_ordered
        description: "Total impressions ordered for this line item"
      - name: campaign_start_date
        description: "Campaign flight start date"
      - name: campaign_end_date
        description: "Campaign flight end date"
      - name: budget
        description: "Budget for this line item"
