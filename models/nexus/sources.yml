version: 2

# Multi-tenant source definitions
# Schema names are parameterized via dbt variables for per-client deployment
# Default values match the legacy shared dataset names

sources:
  - name: fivetran_metadata
    database: res-analytics
    schema: fivetran_metadata
    tables:
      - name: connector_type

  # Facebook Ads sources - schema from var('source_facebook_dataset')
  - name: facebook_ads
    database: res-analytics
    schema: "{{ var('source_facebook_dataset') }}"
    tables:
      - name: account_history
      - name: campaign_history
      - name: ad_set_history
      - name: ad_history
      - name: ads_insights
      - name: ads_insights_actions
      - name: ads_insights_conversions
      - name: ads_insights_action_values
      - name: ads_insights_conversion_values
      - name: campaign_country_daily

  - name: facebook_ads_v2
    database: res-analytics
    schema: "{{ var('source_facebook_dataset') }}"
    tables:
      - name: account_history
      - name: campaign_history
      - name: campaign_country_daily

  # Google Ads sources - schema from var('source_google_dataset')
  - name: google_ads_v2
    database: res-analytics
    schema: "{{ var('source_google_dataset') }}"
    tables:
      - name: account_history
      - name: campaign_history
      - name: country_campaign_report
      - name: ad_history
      - name: ad_group_history
      - name: ad_group_criterion_history
      - name: keyword_stats
      - name: keyword_conversions
      - name: ads_conversions
      - name: campaign_stats
      - name: campaign_conversions

  # Google Ads dbt package (Fivetran) - uses google_ads suffix
  - name: google_ads_v2_google_ads
    database: res-analytics
    schema: "{{ var('source_google_dataset') }}_google_ads"
    tables:
      - name: google_ads__ad_report

  # LinkedIn Ads sources - schema from var('source_linkedin_dataset')
  - name: linkedin_ads
    database: res-analytics
    schema: "{{ var('source_linkedin_dataset') }}"
    tables:
      - name: account_history
      - name: campaign_history
      - name: campaign_group_history
      - name: monthly_ad_analytics_by_member_country
      - name: ad_analytics_by_campaign

  # TikTok Ads sources - schema from var('source_tiktok_dataset')
  - name: tiktok_ads
    database: res-analytics
    schema: "{{ var('source_tiktok_dataset') }}"
    tables:
      - name: advertiser
      - name: campaign_history
      - name: campaign_report_daily
      - name: campaign_country_report

  # Bing/Microsoft Ads sources - schema from var('source_bingads_dataset')
  - name: bingads
    database: res-analytics
    schema: "{{ var('source_bingads_dataset') }}"
    tables:
      - name: account_history
      - name: campaign_history
      - name: ad_group_history
      - name: ad_history
      - name: ad_performance_daily_report
      - name: destination_url_performance_daily_report

  - name: bingads_microsoft_ads
    database: res-analytics
    schema: "{{ var('source_bingads_dataset') }}_microsoft_ads"
    tables:
      - name: microsoft_ads__campaign_country_report

  # HubSpot CRM sources - schema from var('source_hubspot_dataset')
  - name: hubspot
    database: res-analytics
    schema: "{{ var('source_hubspot_dataset') }}"
    tables:
      - name: contact
      - name: company
      - name: deal
      - name: deal_stage

  # Salesforce CRM sources - schema from var('source_salesforce_dataset')
  - name: salesforce
    database: res-analytics
    schema: "{{ var('source_salesforce_dataset') }}"
    tables:
      - name: account
      - name: contact
      - name: lead
      - name: opportunity