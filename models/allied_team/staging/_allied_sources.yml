version: 2

sources:
  - name: allied_team
    database: res-analytics
    schema: allied_team
    description: Allied Team advertising data from Funnel.io
    tables:
      - name: google_ads_funnel
        description: Google Ads (YouTube) campaign performance data
        columns:
          - name: date
            description: Report date
          - name: campaign_id
            description: Google Ads campaign ID
          - name: impressions
            description: Number of ad impressions
          - name: clicks
            description: Number of clicks
          - name: cost
            description: Spend in account currency
          - name: completions
            description: Video completions
            
      - name: magnite_funnel
        description: Magnite CTV campaign performance data
        columns:
          - name: date
            description: Report date
          - name: impressions
            description: Number of ad impressions
          - name: cost_
            description: Spend in account currency
          - name: completions
            description: Video completions
          - name: reach
            description: Unique reach
            
      - name: snowflake_funnel
        description: Jamloop campaign data via Snowflake
        columns:
          - name: date
            description: Report date
          - name: campaign
            description: Campaign name (lacks line item granularity)
          - name: impressions
            description: Number of impressions (from ALLIED_SERVICES_LLD)
          - name: reach
            description: Unique reach (from ALLIED_SERVICES_CREATIVE_AGG)
          - name: completions
            description: Video completions

      - name: raw_clearline_metrics
        description: ClearLine CTV data via sync-clearline Edge Function
        columns:
          - name: date
            description: Report date
          - name: campaign
            description: Campaign name
          - name: creative
            description: Demand tag / line item name
          - name: impressions
            description: Number of ad impressions
          - name: spend
            description: Spend in USD
          - name: completions
            description: Video completions (4th quartile)
          - name: reach
            description: Legacy reach (for backward compatibility)
          - name: ip_reach
            description: IP-based reach from R&F API (recommended for CTV)
          - name: cookie_reach
            description: Cookie-based reach from R&F API
          - name: device_reach
            description: Device-based reach from R&F API
          - name: demand_tag_label
            description: Targeting strategy from R&F API

      - name: clearline_reach_frequency
        description: ClearLine R&F data from dedicated api/v0/reports endpoint
        columns:
          - name: demand_tag_id
            description: ClearLine demand tag ID
          - name: demand_tag_label
            description: Targeting strategy name (joins with creative)
          - name: unique_ips
            description: Unique users by IP (most reliable for CTV)
          - name: unique_cookies
            description: Unique users by cookie
          - name: unique_devices
            description: Unique users by device
          - name: ip_frequency
            description: Frequency by IP (impressions / unique_ips)
          - name: cookie_frequency
            description: Frequency by cookie
          - name: device_frequency
            description: Frequency by device
