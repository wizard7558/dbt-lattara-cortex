version: 2

sources:
  - name: allied_team
    database: res-analytics
    schema: allied_team
    description: Allied Team advertising data from Funnel.io
    tables:
      - name: google_ads_funnel
        description: Google Ads (YouTube) campaign performance data (legacy Funnel.io)
        columns:
          - name: date
            description: Report date
          - name: campaign_id
            description: Google Ads campaign ID
          - name: campaign
            description: Campaign name
          - name: ad_group_name
            description: Ad group name
          - name: advertising_channel_subtype
            description: Channel subtype (VIDEO_NON_SKIPPABLE_IN_STREAM, VIDEO_OUTSTREAM, etc.)
          - name: impressions
            description: Number of ad impressions
          - name: clicks
            description: Number of clicks
          - name: cost
            description: Spend in account currency
          - name: completions
            description: Video completions

      - name: magnite_funnel
        description: Magnite CTV campaign performance data
        columns:
          - name: date
            description: Report date
          - name: impressions
            description: Number of ad impressions
          - name: cost_
            description: Spend in account currency
          - name: completions
            description: Video completions
          - name: reach
            description: Unique reach

      - name: snowflake_funnel
        description: Jamloop campaign data via Snowflake
        columns:
          - name: date
            description: Report date
          - name: campaign
            description: Campaign name (lacks line item granularity)
          - name: impressions
            description: Number of impressions (from ALLIED_SERVICES_LLD)
          - name: reach
            description: Unique reach (from ALLIED_SERVICES_CREATIVE_AGG)
          - name: completions
            description: Video completions

      - name: raw_clearline_metrics
        description: ClearLine CTV data via sync-clearline Edge Function
        columns:
          - name: date
            description: Report date
          - name: campaign
            description: Campaign name
          - name: creative
            description: Demand tag / line item name
          - name: impressions
            description: Number of ad impressions
          - name: spend
            description: Spend in USD
          - name: completions
            description: Video completions (4th quartile)
          - name: reach
            description: Legacy reach (for backward compatibility)
          - name: ip_reach
            description: IP-based reach from R&F API (recommended for CTV)
          - name: cookie_reach
            description: Cookie-based reach from R&F API
          - name: device_reach
            description: Device-based reach from R&F API
          - name: demand_tag_label
            description: Targeting strategy from R&F API

      - name: clearline_reach_frequency
        description: ClearLine R&F data from dedicated api/v0/reports endpoint
        columns:
          - name: demand_tag_id
            description: ClearLine demand tag ID
          - name: demand_tag_label
            description: Targeting strategy name (joins with creative)
          - name: unique_ips
            description: Unique users by IP (most reliable for CTV)
          - name: unique_cookies
            description: Unique users by cookie
          - name: unique_devices
            description: Unique users by device
          - name: ip_frequency
            description: Frequency by IP (impressions / unique_ips)
          - name: cookie_frequency
            description: Frequency by cookie
          - name: device_frequency
            description: Frequency by device

  - name: google_ads_allied_team
    database: res-analytics
    schema: google_ads_allied_team
    description: Allied Team Google Ads data via Fivetran direct connector
    tables:
      - name: ad_stats
        description: Ad-level performance metrics
        columns:
          - name: date
            description: Report date
          - name: campaign_id
            description: Campaign ID
          - name: ad_group_id
            description: Ad group ID
          - name: ad_id
            description: Ad ID
          - name: impressions
            description: Number of impressions
          - name: clicks
            description: Number of clicks
          - name: cost_micros
            description: Cost in micros (divide by 1M for dollars)
          - name: video_trueview_views
            description: TrueView video views
          - name: device
            description: Device type
      - name: campaign_history
        description: Campaign metadata history
        columns:
          - name: id
            description: Campaign ID
          - name: name
            description: Campaign name
          - name: advertising_channel_subtype
            description: Channel subtype (VIDEO_NON_SKIPPABLE, etc.)
          - name: advertising_channel_type
            description: Channel type (VIDEO, SEARCH, etc.)
      - name: ad_group_history
        description: Ad group metadata history
        columns:
          - name: id
            description: Ad group ID
          - name: campaign_id
            description: Parent campaign ID
          - name: name
            description: Ad group name
      - name: ad_history
        description: Ad metadata history
        columns:
          - name: id
            description: Ad ID
          - name: ad_group_id
            description: Parent ad group ID
          - name: name
            description: Ad name
