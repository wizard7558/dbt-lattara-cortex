name: 'analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

dbt-cloud:
  project-id: 70471823538167

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Multi-tenant variables for self-serve deployment
# Override via --vars flag: dbt run --vars '{"target_dataset": "com_client_cortex", ...}'
# Default values match the legacy shared dataset names for backwards compatibility
vars:
  # Target dataset for dbt output (client's cortex dataset)
  target_dataset: "cortex"

  # Nexus-style variables for graceful degradation pattern
  # These construct schema names like: {bq_dataset_id}_facebook_ads
  bq_project_id: "res-analytics"
  bq_dataset_id: "cortex"  # Will be overridden per-client, e.g., "com_acme"

  # Source datasets for each platform (client's raw data datasets)
  # Note: These are kept for backwards compatibility but the nexus pattern
  # uses bq_dataset_id to construct schema names dynamically
  source_facebook_dataset: "facebook_ads_v2"
  source_google_dataset: "google_ads_v2"
  source_linkedin_dataset: "linkedin_ads"
  source_tiktok_dataset: "tiktok_ads"
  source_bingads_dataset: "bingads"
  source_hubspot_dataset: "hubspot"
  source_salesforce_dataset: "salesforce"

  # Organization ID for client-specific logic
  organization_id: ""

  # Cortex V2 multi-tenant variables
  gcp_project: "res-analytics"
  output_dataset: "cortex_marts"  # Output dataset for cortex_v2 marts

models:
  analytics:
    nexus:
      # Schema is determined by generate_schema_name macro using target_dataset var
      +schema: cortex
      +materialized: table
    allied_team:
      +schema: allied_team
      +materialized: table
      staging:
        +materialized: view
    cortex_v2:
      +schema: cortex_marts
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table
