name: 'analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

dbt-cloud:
  project-id: 70471823538167

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Multi-tenant variables for self-serve deployment
# Override via --vars flag: dbt run --vars '{"target_dataset": "com_client_cortex", ...}'
vars:
  # Target dataset for dbt output (client's cortex dataset)
  target_dataset: "cortex"

  # Nexus-style variables for graceful degradation pattern
  # These construct schema names like: {bq_dataset_id}_facebook_ads
  bq_project_id: "res-analytics"
  bq_dataset_id: "cortex"  # Will be overridden per-client, e.g., "com_acme"

  # Source datasets for each platform (per-client raw data)
  #
  # IMPORTANT: These defaults are intentionally unresolvable stubs.
  # Every nexus model uses adapter.get_relation() on these vars and, when
  # the relation resolves to None, skips that network via an empty fallback.
  #
  # Historically these defaulted to real multi-tenant datasets
  # (facebook_ads_v2, google_ads_v2, linkedin_ads, tiktok_ads, bingads),
  # which caused catastrophic cross-tenant data contamination: any client
  # whose workflow dispatch omitted a source_*_dataset override would
  # silently read from the shared default and relabel every other tenant's
  # accounts/spend with the current client's organization_id.
  #
  # Every client MUST now provide explicit source_*_dataset overrides for
  # each network it uses. Missing overrides = no data for that network,
  # which is the safe default.
  source_facebook_dataset: "__unconfigured_facebook__"
  source_google_dataset: "__unconfigured_google__"
  source_linkedin_dataset: "__unconfigured_linkedin__"
  source_tiktok_dataset: "__unconfigured_tiktok__"
  source_bingads_dataset: "__unconfigured_bingads__"
  source_hubspot_dataset: "__unconfigured_hubspot__"
  source_salesforce_dataset: "__unconfigured_salesforce__"

  # Organization ID for client-specific logic
  organization_id: ""

  # Cortex V2 multi-tenant variables
  gcp_project: "res-analytics"
  output_dataset: "cortex_marts"  # Output dataset for cortex_v2 marts

models:
  analytics:
    nexus:
      # Schema is determined by generate_schema_name macro using target_dataset var
      +schema: cortex
      +materialized: table
    allied_team:
      +schema: allied_team
      +materialized: table
      staging:
        +materialized: view
    cortex_v2:
      +schema: cortex_marts
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table
