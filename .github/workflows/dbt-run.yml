name: dbt run

on:
  workflow_dispatch:
    inputs:
      target_dataset:
        description: 'Target BigQuery dataset (e.g., cortex, com_acme_cortex)'
        required: false
        default: 'cortex'
      bq_dataset_id:
        description: 'BigQuery dataset prefix (e.g., cortex, com_acme)'
        required: false
        default: 'cortex'
      organization_id:
        description: 'Organization ID (for logging)'
        required: false
        default: ''
      triggered_by:
        description: 'What triggered this run'
        required: false
        default: 'manual'
      models:
        description: 'dbt model selector (e.g., allied_team, nexus, +mart_kpi_daily)'
        required: false
        default: 'allied_team --exclude allied_internal_report'
      full_refresh:
        description: 'Run with --full-refresh'
        required: false
        default: 'false'

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery==1.11.0

      - name: Configure GCP credentials
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          default:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: res-analytics
                dataset: cortex
                keyfile: /tmp/gcp-key.json
                threads: 4
                timeout_seconds: 300
                location: US
          EOF
          # Fix indentation (heredoc preserves leading spaces from YAML)
          sed -i 's/^          //' ~/.dbt/profiles.yml

      - name: Run dbt
        run: |
          # Build vars JSON — derive per-org source dataset names from bq_dataset_id
          BQ_DS="${{ inputs.bq_dataset_id }}"
          if [ "$BQ_DS" != "cortex" ] && [ -n "$BQ_DS" ]; then
            # Per-org run: Fivetran datasets follow {org_prefix}_{platform} naming
            VARS='{"target_dataset": "${{ inputs.target_dataset }}", "bq_dataset_id": "'"$BQ_DS"'", "organization_id": "${{ inputs.organization_id }}", "source_facebook_dataset": "'"${BQ_DS}_facebook_ads"'", "source_google_dataset": "'"${BQ_DS}_google_ads"'", "source_linkedin_dataset": "'"${BQ_DS}_linkedin_ads"'", "source_tiktok_dataset": "'"${BQ_DS}_tiktok_ads"'", "source_bingads_dataset": "'"${BQ_DS}_bing_ads"'"}'
          else
            # Default/legacy run: use dbt_project.yml defaults
            VARS='{"target_dataset": "${{ inputs.target_dataset }}", "bq_dataset_id": "'"$BQ_DS"'", "organization_id": "${{ inputs.organization_id }}"}'
          fi

          CMD="dbt run --vars '${VARS}'"

          if [ -n "${{ inputs.models }}" ]; then
            CMD="${CMD} --select ${{ inputs.models }}"
          fi

          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            CMD="${CMD} --full-refresh"
          fi

          echo "Running: ${CMD}"
          eval ${CMD}

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-key.json

  notify-failure:
    name: Notify Pipeline Failure
    runs-on: ubuntu-latest
    needs: [dbt-run]
    if: failure()
    steps:
      - name: Send Slack notification
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚨 dbt run failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🚨 CRITICAL: dbt-run (GitHub Actions)" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }} #${{ github.run_number }} failed*"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Failed Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "Branch: `${{ github.ref_name }}` | Triggered by: ${{ github.actor }}" }
                  ]
                }
              ]
            }'
